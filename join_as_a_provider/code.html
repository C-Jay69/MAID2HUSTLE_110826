<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MAID 2 HUSTLE - Join as a Provider</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a855f7",
                        "secondary-cyan": "#06b6d4",
                        "background-light": "#f7f5f8",
                        "background-dark": "#000000",
                        "gray-800": "#1f2937",
                        "gray-400": "#9ca3af",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
        }
        .gradient-btn {
            background: linear-gradient(90deg, #a855f7 0%, #06b6d4 100%);
        }
        /* Custom scrollbar for better appearance in dark mode */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-white font-display">
<div class="relative flex min-h-screen w-full flex-col max-w-[430px] mx-auto overflow-x-hidden border-x border-gray-800 shadow-2xl">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-50">
<div class="text-white flex size-12 shrink-0 items-center justify-start cursor-pointer" data-icon="arrow_back" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12 uppercase tracking-widest">Maid 2 Hustle</h2>
</div>
<!-- PageIndicators (Step 1 of 3 active) -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-5">
<div class="h-1.5 w-12 rounded-full bg-primary"></div>
<div class="h-1.5 w-12 rounded-full bg-gray-800"></div>
<div class="h-1.5 w-12 rounded-full bg-gray-800"></div>
</div>
<!-- HeadlineText -->
<div class="px-4">
<h2 class="text-white tracking-tight text-[28px] font-bold leading-tight pb-1 pt-5">Let's get started</h2>
<p class="text-gray-400 text-base font-normal leading-normal pb-6">Step 1: Personal info</p>
</div>
<!-- Step 1 Form Fields -->
<div class="space-y-4 px-4">
<!-- TextField: Full Name -->
<div class="flex flex-col w-full">
<label class="flex flex-col w-full">
<p class="text-gray-400 text-sm font-medium leading-normal pb-2 px-1">Full Name</p>
<input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-gray-800 bg-[#111111] focus:border-primary h-14 placeholder:text-gray-600 p-[15px] text-base font-normal" placeholder="John Doe" value=""/>
</label>
</div>
<!-- TextField: Email -->
<div class="flex flex-col w-full">
<label class="flex flex-col w-full">
<p class="text-gray-400 text-sm font-medium leading-normal pb-2 px-1">Email Address</p>
<input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-gray-800 bg-[#111111] focus:border-primary h-14 placeholder:text-gray-600 p-[15px] text-base font-normal" placeholder="john@example.com" type="email" value=""/>
</label>
</div>
<!-- TextField: Phone -->
<div class="flex flex-col w-full">
<label class="flex flex-col w-full">
<p class="text-gray-400 text-sm font-medium leading-normal pb-2 px-1">Phone Number</p>
<input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-gray-800 bg-[#111111] focus:border-primary h-14 placeholder:text-gray-600 p-[15px] text-base font-normal" placeholder="+1 (555) 000-0000" type="tel" value=""/>
</label>
</div>
</div>
<div class="h-10"></div>
<!-- Step 2 Preview Headline -->
<div class="px-4 opacity-50">
<h2 class="text-white tracking-tight text-[22px] font-bold leading-tight pb-1">Professional Details</h2>
<p class="text-gray-400 text-sm mb-4">You'll complete this in the next step</p>
<!-- Category Selection Mock -->
<div class="grid grid-cols-2 gap-3 mb-6">
<div class="border border-gray-800 rounded-xl p-4 flex flex-col items-center gap-2 bg-[#111111]">
<span class="material-symbols-outlined text-primary">cleaning_services</span>
<span class="text-xs">Cleaning</span>
</div>
<div class="border border-gray-800 rounded-xl p-4 flex flex-col items-center gap-2 bg-[#111111]">
<span class="material-symbols-outlined text-primary">handyman</span>
<span class="text-xs">Handyman</span>
</div>
</div>
<!-- License Upload Mock -->
<div class="border-2 border-dashed border-gray-800 rounded-xl p-8 flex flex-col items-center justify-center text-center gap-2">
<span class="material-symbols-outlined text-gray-400 text-3xl">cloud_upload</span>
<p class="text-sm font-medium">Upload License or ID</p>
<p class="text-[10px] text-gray-600">PDF, JPG up to 5MB</p>
</div>
</div>
<!-- Spacer to push content up if needed -->
<div class="flex-grow"></div>
<!-- Footer / Action Area -->
<div class="p-4 bg-background-dark border-t border-gray-800 pb-10 sticky bottom-0">
<div class="flex items-center gap-3 mb-6">
<input class="w-5 h-5 rounded border-gray-800 bg-[#111111] text-primary focus:ring-primary" id="terms" type="checkbox"/>
<label class="text-xs text-gray-400" for="terms">
                    I agree to the <span class="text-primary underline">Terms of Service</span> and <span class="text-primary underline">Privacy Policy</span>.
                </label>
</div>
<button class="gradient-btn w-full h-14 rounded-xl text-white font-bold text-lg shadow-lg flex items-center justify-center gap-2 transition-transform active:scale-95">
                Continue to Professional Info
                <span class="material-symbols-outlined">chevron_right</span>
</button>
<p class="text-center text-gray-600 text-[10px] mt-4 uppercase tracking-[0.2em]">Maid 2 Hustle Provider Portal</p>
</div>
</div>
</body></html>
