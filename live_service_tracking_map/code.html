<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Service Tracking Map - MAID 2 HUSTLE</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7f13ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#191022",
                        "card-dark": "#2a2a2a",
                        "accent-cyan": "#00f2ff"
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .map-gradient-overlay {
            background: linear-gradient(180deg, rgba(25, 16, 34, 0.8) 0%, rgba(25, 16, 34, 0) 25%, rgba(25, 16, 34, 0) 75%, rgba(25, 16, 34, 1) 100%);
        }
        .route-path {
            stroke-dasharray: 8;
            filter: drop-shadow(0 0 4px #7f13ec);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden h-screen flex flex-col">
<!-- Top Navigation Bar -->
<div class="fixed top-0 left-0 right-0 z-50 flex items-center bg-background-dark/60 backdrop-blur-md p-4 pb-2 justify-between border-b border-white/5">
<div class="text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</div>
<div class="flex flex-col items-center flex-1">
<h2 class="text-white text-base font-bold leading-tight tracking-tight uppercase">Live Tracking</h2>
<p class="text-[10px] text-primary font-bold tracking-widest uppercase">Maid 2 Hustle</p>
</div>
<div class="flex w-12 items-center justify-end">
<div class="bg-primary/20 px-2 py-1 rounded-full border border-primary/30">
<p class="text-primary text-[10px] font-bold leading-none tracking-tight shrink-0 uppercase">In Route</p>
</div>
</div>
</div>
<!-- Map Section (Full Height with Overlays) -->
<div class="relative flex-1 w-full bg-[#0b0712]">
<!-- Map Background -->
<div class="absolute inset-0 opacity-40 grayscale contrast-125" data-alt="Dark stylized city map with street grid" data-location="New York City" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBdSGhop4zztgHhHptAzRtwoMAoT_ErxfxDc5yYGCQqlxYac2jmDWsZ1bEZHm1SSEsvjv0tzWOcVyk2a4RIDYc_mcEcC9m5LurUg2tM_dFdtO6mxsPQh2uBgvtrHFqB-t9f6hnj63UxmY3xbmSsCG2ihGUV5qQJh3Oz57dXVWZzfGiDV04cuBW3CISmqwGp_EcjV_DpM57bBH-KicnJcGpwwhroZFjzota-xhgTj8ytf_8iQ2--zmrVJzMcrx3hx6tW9VCtR4ezWXND"); background-size: cover;'>
</div>
<!-- Map Overlay & Gradients -->
<div class="absolute inset-0 map-gradient-overlay pointer-events-none"></div>
<!-- Route Visualization -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 400 800">
<!-- The Route -->
<path class="route-path" d="M100,500 C150,450 250,400 300,300" fill="none" stroke="url(#routeGradient)" stroke-linecap="round" stroke-width="4"></path>
<defs>
<lineargradient id="routeGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:#7f13ec;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#00f2ff;stop-opacity:1"></stop>
</lineargradient>
</defs>
<!-- Provider Location Marker (Glowing Dot) -->
<circle cx="100" cy="500" fill="#7f13ec" r="8">
<animate attributename="r" dur="2s" repeatcount="indefinite" values="8;12;8"></animate>
<animate attributename="opacity" dur="2s" repeatcount="indefinite" values="1;0.5;1"></animate>
</circle>
<circle cx="100" cy="500" fill="none" r="15" stroke="#7f13ec" stroke-width="1">
<animate attributename="r" dur="2s" repeatcount="indefinite" values="15;25;15"></animate>
<animate attributename="opacity" dur="2s" repeatcount="indefinite" values="0.4;0;0.4"></animate>
</circle>
<!-- Destination Marker -->
<g transform="translate(300, 300)">
<circle cx="0" cy="0" fill="#00f2ff" r="6"></circle>
<path d="M0,0 L0,-20" stroke="#00f2ff" stroke-width="2"></path>
<circle cx="0" cy="-20" fill="#00f2ff" r="4"></circle>
</g>
</svg>
<!-- Floating Map Controls -->
<div class="absolute right-4 bottom-72 flex flex-col gap-3">
<div class="flex flex-col gap-0.5 overflow-hidden rounded-lg shadow-2xl">
<button class="flex size-11 items-center justify-center bg-card-dark/90 text-white hover:bg-primary transition-colors">
<span class="material-symbols-outlined text-xl">add</span>
</button>
<button class="flex size-11 items-center justify-center bg-card-dark/90 text-white hover:bg-primary transition-colors border-t border-white/5">
<span class="material-symbols-outlined text-xl">remove</span>
</button>
</div>
<button class="flex size-11 items-center justify-center rounded-lg bg-primary shadow-lg shadow-primary/20 text-white">
<span class="material-symbols-outlined text-xl">my_location</span>
</button>
</div>
</div>
<!-- Bottom Sheet Information Card -->
<div class="relative z-20 bg-card-dark rounded-t-xl border-t border-white/10 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] pb-8">
<!-- Handle -->
<div class="flex w-full items-center justify-center py-3">
<div class="h-1.5 w-12 rounded-full bg-white/10"></div>
</div>
<!-- Provider Info Header -->
<div class="px-6 py-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="size-16 rounded-lg bg-cover bg-center border-2 border-primary/40 shadow-lg shadow-primary/10" data-alt="Professional portrait of service provider Sarah J." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBjSrQVlJJTDv-TnZnsTULjLdU7RtNs4ViIgesUDzCtRnrXtm7UuiUOHVTXO8u4pwiiUqq-7R_qC3NWr9cUUdH2w-DrG3wZ2BXU6bdoTuuTMUjCMFh-HVpX4bdXsorwfDoMQkzMXKZTUr_X2BdZBXKvQg37Nmyovq6Q08cR2XBUUPtPk0ZxYqtOanNQLcnweKMTQbAbFi_aO4Rb-QTeyR4yK3Ka5RpQyN1bqCRl2s9XO2a7XM3Pyz57mt87osoX1Q7E-GK_vPu85hRY");'>
</div>
<div class="flex flex-col">
<div class="flex items-center gap-2">
<h3 class="text-white text-xl font-bold">Sarah J.</h3>
<div class="flex items-center bg-primary/10 px-1.5 py-0.5 rounded">
<span class="material-symbols-outlined text-[12px] text-primary fill-current">star</span>
<span class="text-[10px] font-bold text-primary ml-1">4.9</span>
</div>
</div>
<p class="text-white/60 text-sm font-medium">Deep Cleaning Specialist</p>
</div>
</div>
<div class="flex flex-col items-end">
<span class="text-[10px] uppercase tracking-widest text-white/40 font-bold">Arriving in</span>
<span class="text-2xl font-black text-primary">12 <span class="text-xs uppercase">min</span></span>
</div>
</div>
<!-- Live Stats Grid -->
<div class="grid grid-cols-2 gap-3 px-6 py-2">
<div class="bg-white/5 rounded-lg p-4 border border-white/5">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-accent-cyan text-lg">distance</span>
<p class="text-white/40 text-[10px] font-bold uppercase tracking-wider">Distance</p>
</div>
<p class="text-white text-lg font-bold">0.8 <span class="text-xs font-normal text-white/60">miles</span></p>
</div>
<div class="bg-white/5 rounded-lg p-4 border border-white/5">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-lg">schedule</span>
<p class="text-white/40 text-[10px] font-bold uppercase tracking-wider">Scheduled</p>
</div>
<p class="text-white text-lg font-bold">2:30 <span class="text-xs font-normal text-white/60">PM</span></p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-3 px-6 pt-4 pb-2">
<button class="flex flex-1 items-center justify-center gap-2 h-12 rounded-lg bg-white/10 hover:bg-white/20 text-white font-bold transition-all border border-white/5">
<span class="material-symbols-outlined">call</span>
<span>Call</span>
</button>
<button class="flex-[2] flex items-center justify-center gap-2 h-12 rounded-lg bg-primary hover:bg-primary/90 text-white font-bold shadow-lg shadow-primary/30 transition-all">
<span class="material-symbols-outlined">chat_bubble</span>
<span>Message</span>
</button>
</div>
<!-- Safety/Help Row -->
<div class="px-6 pt-4 flex items-center justify-between text-white/30">
<button class="flex items-center gap-1.5 hover:text-white transition-colors">
<span class="material-symbols-outlined text-sm">share_location</span>
<span class="text-[11px] font-bold uppercase">Share Status</span>
</button>
<button class="flex items-center gap-1.5 hover:text-white transition-colors">
<span class="material-symbols-outlined text-sm">support_agent</span>
<span class="text-[11px] font-bold uppercase">Help</span>
</button>
</div>
</div>
<!-- iOS Home Indicator -->
<div class="bg-card-dark pb-2 flex justify-center">
<div class="w-32 h-1 bg-white/20 rounded-full mb-1"></div>
</div>
</body></html>
